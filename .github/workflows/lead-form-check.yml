name: Lead form check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject placeholder forms and missing assets
        run: node scripts/check-lead-forms.mjs
      - name: Lead submit tests with mocked fetch
        run: node --test scripts/test-tdp-leads.mjs
